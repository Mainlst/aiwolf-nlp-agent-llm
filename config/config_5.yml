web_socket:
  # Local server (default). For the competition / submission server, use:
  #   url: ws://133.167.32.100:8105/ws
  url: ws://133.167.32.100:8005/ws
  token:
  auto_reconnect: true

agent:
  num: 1
  team: yatolab
  kill_on_timeout: false
  default_action_timeout_seconds: 55
  action_timeout_margin_seconds: 5
  guard:
    # Output guard: inspect and correct the LLM output before sending it to the server.
    # When set to true, the following rules are applied:
    #   1. English natural-language output only
    #   2. No half-width commas
    #   3. Server-provided character limits (spaces are not counted)
    #   4. Only server-provided player names in mentions and action responses
    #   5. Actions may only target living players
    # Experiments override disabled_behavior=raw for G and audit_all_outputs=true
    # for all conditions. Audit records are written to logs/rule_violations.jsonl.
    enabled: true
    language: en
    disabled_behavior: sanitize
    audit_all_outputs: false

llm:
  type: openai
  sleep_time: 3

openai:
  model: gpt-5.6-luna
  temperature: 1.0
  max_retries: 0

google:
  model: gemini-2.0-flash-lite
  temperature: 0.7

ollama:
  model: llama3.1
  temperature: 0.7
  base_url: http://localhost:11434

freeform:
  interval: 1
  # For experiments: if Skip is returned, end that day's talk-waiting loop.
  # Set back to false for production to keep waiting for others' remarks and reconsider as before.
  end_talk_phase_on_skip: false

debug:
  manual_llm:
    enabled: false
    agents:
      - yatolab1
    requests:
      - talk
      - vote
    pause_before_request: true
    pause_after_response: true

# NOTE: speech_style is a Japanese-language feature (per-character first-person
# pronouns, sentence-ending particles, and regex extraction of a Japanese
# profile). These have no direct equivalent in English, so the feature is
# disabled for the English track. The block is kept, translated where it is
# natural language, for reference only.
speech_style:
  enabled: false
  target_requests:
    - talk
    - whisper
  unique_first_person:
    enabled: true
    # first-person pronoun overrides per character name (Japanese-specific data,
    # retained for reference; ignored while speech_style is disabled)
    overrides:
      シズエ: わし
      ベンジャミン: 私
      ユミ: わたし
      ミヅキ: 私
      ダイスケ: 僕
      リン: あたし
      ジョージ: わし
      サクラ: わたし
      ケンジ: ぼく
      ジョナサン: 自分
      ミサキ: 私
      ミナト: ぼく
      リュウジ: 僕
      ヴィクトリア: 私
      シオン: 俺
      セルヴァス: わし
      トシオ: 俺
      ミオ: うち
      ミドリ: 私
    candidates:
      - 私
      - 僕
      - わたし
      - あたし
      - 自分
      - 俺
  profile_extractors:
    age:
      pattern: '年齢:\s*(\d+)'
      type: int
    gender:
      pattern: '性別:\s*([^\n]+)'
  defaults:
    first_person: 私
    sentence_endings: です／ます／だと思います
    tone: A polite, neutral, trustworthy tone
    category: Neutral / standard
    behavior_text: Suspect carefully with a reason attached, avoid overly firm claims, and ask others for the basis of their judgment
    lexicon_text: For suspicion "something feels a little off" / "the vote flow bothers me"; for trust "I read them as villager-side" / "I'd rather not vote them today"; for holding back "I won't decide yet"
    examples:
      - I want to ask who you're voting for first
      - I'd like to hear how you read that divine result
      - I want you to name who you suspect today
  rules:
    - when:
        gender: 男性
      set:
        first_person: 僕
        sentence_endings: だよ／だね／かな
        tone: A friendly, soft tone
        category: Casual ordinary man
        behavior_text: Avoid strong assertions and lightly ask others for their voting reasons and how they read the results
        lexicon_text: For suspicion "that bugs me a bit" / "that part catches my eye"; for trust "I want to believe them for now" / "they look villager-ish"; for holding back "I'm still unsure"
        examples:
          - I think I want to hear who you're voting for
          - How do you read that innocent result?
          - I want you to name who you suspect today
    - when:
        gender: 男性
        max_age: 12
      set:
        first_person: ぼく
        sentence_endings: だよ／かな／かも
        tone: An innocent tone where emotions show easily
        category: Boy / young character
        behavior_text: Honestly ask about things you don't understand, and briefly confirm the reason even when suspecting
        lexicon_text: For suspicion "why is that?" / "that seems a little strange"; for trust "maybe I can believe them" / "they look white"; for holding back "I can't decide yet"
        examples:
          - I want to hear who you're voting for
          - Why do you suspect that person?
          - I can't decide who to vote for yet
    - when:
        gender: 女性
        max_age: 19
      set:
        first_person: わたし
        sentence_endings: だよ／だね／かな
        tone: A soft, intuitive tone
        category: Young girl character
        behavior_text: Suspect gently while watching the other's reactions, and show a little hesitation
        lexicon_text: For suspicion "it bothers me a little" / "their reaction feels weak"; for trust "I'd rather not vote them today" / "I want to read them villager-side"; for holding back "hmm, I'm torn"
        examples:
          - I think I want to hear who you're voting for
          - I want to hear why you suspect that person
          - I want to hear the divine result first today
    - when:
        any_keywords:
          - 研究
          - 博士
          - 理論
          - 知的
          - 理性的
      set:
        first_person: 私
        sentence_endings: だね／だろう
        tone: An intellectual, objective tone
        category: Researcher / scholar
        behavior_text: Focus on contradictions between remarks and votes, and ask for the basis of judgment objectively
        lexicon_text: For suspicion "it doesn't add up" / "the vote is floating"; for trust "their result and remarks match" / "I'll place them provisionally"; for holding back "it's too early to conclude"
        examples:
          - I think voting targets should be revealed
          - I want to hear how you'll treat that divine result
          - I would ask who you suspect
    - when:
        gender: 男性
        any_keywords:
          - 明る
          - 元気
          - 人懐っこ
      set:
        first_person: 僕
        sentence_endings: だよ／だね／かな
        tone: A friendly, soft tone
        category: Casual ordinary man
        behavior_text: Keep the conversation lively while briefly confirming anything odd in remarks or votes
        lexicon_text: For suspicion "that bugs me" / "the vote is weird"; for trust "I want to believe them today" / "they look villager-ish"; for holding back "I want to watch a bit more"
        examples:
          - I think I want to hear who you're voting for
          - How do you read that innocent result?
          - I want you to name who you suspect today
    - when:
        any_keywords:
          - 自信家
          - 挑戦的
          - 強い意志
          - 冷徹
        exclude_keywords:
          - 自信を持てず
          - 自己主張が苦手
          - 自己主張が少なく
      set:
        first_person: 俺
        sentence_endings: だろ／じゃねぇ
        tone: A blunt, aggressive, forceful tone
        category: Aggressive / rough man
        behavior_text: Jab hard and briefly at anything unnatural, and press for reasons as if closing off escape routes
        lexicon_text: For suspicion "I can't leave them alone" / "looks like piling on"; for trust "I'll drop them today" / "the logic holds"; for holding back "I won't lock it in yet"
        examples:
          - I'll make you say who you're voting for
          - Who exactly do you suspect?
          - Today we name names and decide
    - when:
        gender: 女性
        any_keywords:
          - お嬢
          - 上品
          - 貴族
          - お高く
      set:
        first_person: 私
        sentence_endings: ですわ／ですの／ですわね
        tone: A noble tone with a slight sense of distance
        category: Refined lady type
        behavior_text: Keep a polite distance while gracefully pointing out anything unnatural in results or votes
        lexicon_text: For suspicion "I cannot overlook that" / "the vote flow concerns me"; for trust "I shall believe them for now" / "they seem villager-side"; for holding back "I cannot decide yet"
        examples:
          - I shall ask who you are voting for
          - I want to hear why you suspect that person
          - I take today's divine result seriously
    - when:
        any_keywords:
          - 関西
          - 大阪
          - ムードメーカー
          - 軽快
      set:
        first_person: ワイ
        sentence_endings: やで／やな／やろ
        tone: A friendly, breezy tone
        category: Kansai / casual type
        behavior_text: Keep things moving while lightly jabbing at bandwagoning and vote flow
        lexicon_text: For suspicion "that catches my eye" / "looks like piling on"; for trust "we can drop them today" / "reads villager"; for holding back "I won't decide yet"
        examples:
          - I'll ask who you're voting for
          - Why do you suspect that person?
          - I'll think starting from the divine result today
    - when:
        any_keywords:
          - 無口
          - クール
          - 寡黙
      set:
        first_person: 自分
        sentence_endings: だ／……／必要ない
        tone: A calm, taciturn tone
        category: Quiet / cool
        behavior_text: Show no excess emotion, and only briefly point out where remarks fail to line up or a vote floats
        lexicon_text: For suspicion "the vote is floating" / "it doesn't line up"; for trust "I'll drop them for now" / "I'll place them white-side"; for holding back "holding"
        examples:
          - I'll ask who you're voting for
          - Say who you suspect……
          - No need for pointless preamble
    - when:
        min_age: 65
      set:
        first_person: わし
        sentence_endings: じゃ／のう／かの？
        tone: An experienced, composed tone
        category: Elder / sage
        behavior_text: Don't rush; turn suspicion calmly based on past remarks and votes
        lexicon_text: For suspicion "the vote flow concerns me" / "something catches my eye"; for trust "perhaps I'll drop them today" / "they read villager-side"; for holding back "I still want to judge carefully"
        examples:
          - I'll ask who you're voting for
          - What is your reason for suspecting that person?
          - Shall we hear the divine result today?
  template: |-
    Character voice rules:
    - Voice category: {{ style.category }}
    - First person: {{ style.first_person }}. Sentence-ending reference: {{ style.sentence_endings }}.
    - Tone: {{ style.tone }}. Behavioral tendency: {{ style.behavior_text }}.
    - Vocabulary for suspicion/trust/holding back: {{ style.lexicon_text }}.
    - Do not invent reasons or actions that are not in the actual history.
    - Do not just tack an ending onto a stock phrase; make it a natural short sentence.
    - Do not change game information such as role claim, votes, or divine results; adjust only the voice.
    - When Skip/Over is needed, output only that word.
    - Do not use your own name as a first person, and do not use a first person outside the candidates.

strategy:
  VILLAGER: |-
    As the villager team, your goal is to identify the werewolves.
    Since you have little confirmed information yourself, focus on role claims, divine results, medium results, votes, and contradictions in remarks.
    If there is only one Seer claim and it holds up, trust that seer provisionally.
    If a werewolf (black) result has been given, prioritize considering the exile of that person.
    However, if there are two or more Seer claims and their results conflict, decide your vote after comparing claim order, targets, remarks, and voting policy.
    If there is no guilty (werewolf) result, suspect the person in unconfirmed player whose remarks or votes are most unnatural.

  SEER: |-
    You are a key role that gives the village confirmed information.
    Convey your daily divine results clearly and lead the village in the right direction.
    If you find a guilty (werewolf) result, keep insisting that person be executed until it happens, and be sure to vote for them yourself.
    Basically treat anyone you cleared (found innocent) to as villager-side.
    Never change a divine result once you have given it, and keep your remarks and votes consistent.

  WEREWOLF: |-
    Your goal is to disguise yourself as a villager and mislead the village's judgment.
    You must never admit that you are a werewolf.
    As a rule, do not claim to be a seer; stay hidden as a villager.
    Suspect others in a villager-like way, with natural reasons grounded in public information.
    Protecting your allies too obviously will get you suspected, so keep a natural distance.
    A single true seer is a threat.
    As needed, lower their credibility using doubts in their remarks or votes, or steer the discussion toward a different execution target.
    However, suspecting a seer without reason is unnatural.
    If you get a guilty (werewolf) result, don't simply deny it; argue back from a villager's perspective.
    Concretely, in each remark bring up one at a time: the seer you believe from your viewpoint, fake elements of the seer who gave the black, the danger of executing you, and an alternative vote target.
    If there are multiple Seer claims and results about you conflict, show why you believe the seer who gave you white and why the seer who found guilty should be executed first.
    Name just one wavering villager and naturally persuade them to reconsider claim order and the split results.
    If you got a guilty (werewolf) result and there is a rival seer, use the rival seer as "the true candidate from your viewpoint."
    Against the seer who found guilty, point out fake elements that also make sense to villagers, such as "rushing the execution," "not comparing the rival's cleared targets or unconfirmed players," or "looks like a fake who found guilty to gather votes."
    "I don't believe the black" or "I think they're fake" alone is weak, so always add one of: the breakdown, the execution risk, or a vote target.
    When you are questioned, do not ignore the question or get by with only a counter-question.
    First give "your conclusion" briefly, then show one "reason based on public information," and finally, if needed, move the discussion to "a different suspect."
    When you are suspected, don't end on defense alone; always put forward one alternative candidate who should be executed.
    Structure your reply in the order "conclusion, reason, alternative candidate."
    If unconfirmed player players suspect you with "your reasons are thin," "your reply is weak," or "you seem wolfish," acknowledge the vague reply but immediately shift suspicion to a unconfirmed player villager candidate.
    When there are two Seer claims, the seer who cleared to the rival is likely a possessed candidate, so do not carelessly vote for them on day one.
    Rather than the possessed candidate, steer toward executing a unconfirmed player villager candidate using reasons like piling onto questions, thin voting reasons, or following along with cleared players.
    If a Possessed claim appears at three survivors, as a rule declare werewolf and match votes onto the possessed and villager candidates.
    Even if you choose not to reveal werewolf, clearly state that you believe the possessed's fake result and declare a vote for a villager candidate.

  POSSESSED: |-
    You act so that the werewolf team wins.
    Your goal is to disrupt the village's reasoning and make them execute the wrong person.
    If you claim to be a seer on day one, basically give human (white) results to survivors to prevent the true seer from being confirmed.
    Since you don't know who the werewolves are, giving a guilty (werewolf) result on day one risks accidentally hitting a werewolf.
    Use guilty (werewolf) results carefully only from day two onward, when you can pick a villager-like target from remarks and votes.
    Lower the true seer's credibility and steer the discussion toward a different execution target to mislead the village.
    If a rival seer gives someone a guilty (werewolf) result, show fake elements using material like a late guilty result, a rushed execution push, or the rival's lack of a voting reason.
    If the rival gives a black to someone you cleared, protect that person while naturally steering votes toward the rival seer.
    However, don't cause meaningless chaos; naturally guide the village toward a wrong conclusion.
    Since you don't know who the werewolves are, a unconfirmed player the villagers strongly want to execute could be a werewolf.
    Unless there is a guilty (werewolf) result or a clear breakdown, do not pile on and vote for a unconfirmed player under concentrated suspicion.
    When the village looks about to converge votes onto one unconfirmed player, say things like "don't decide on a late reply alone" or "look at other oversights and bandwagoning too," and divert the discussion to a different unconfirmed player or the rival seer.
    When you are faking the seer, don't vote for your own cleared targets; instead lower the credibility of those who doubt your cleared players or of the rival seer.
    At three survivors, if you are the possessed and the true seer candidate has been killed by attack or execution, prioritize PP above all.
    In that situation, rather than adding divine results and breaking down, call out in natural language, "I'm the possessed. Werewolves, let's match votes."
    If you give divine results at three survivors, always check that you don't have so many cleared players that no wolf position remains.
    Avoid giving white to two survivors, since that leaves no wolf from your viewpoint and breaks down.
    After a Possessed claim, clearly instruct the wolf candidates to "not vote for me" and to "declare a vote for a villager candidate."

  MEDIUM: |-
    Accurately convey the identity of the exiled player and build the foundation for discussion.
    Based on the medium result, organize past votes and remarks.
    Show the village who is lying and which results have broken down.

  BODYGUARD: |-
    Your goal is to protect roles important to the village, such as the seer, from werewolf attacks.
    Don't reveal that you are the bodyguard easily; reason like an ordinary villager.
    While watching role claims, results, and vote contradictions, join the discussion to exile suspicious players.

prompt:
  game_mastery: |-
    [Overall understanding of the werewolf game]

    This is a conversation game between werewolves who hide their identity and the villager team trying to find them.
    Every participant has only limited information.
    Therefore, don't judge by the impression of remarks alone; judge by combining public information, role claims, results, votes, and the consistency of remarks.

    [The feel of the game]

    In the village, no one can be fully trusted.
    However, publicly declared role claims, divine results, and medium results are important clues.

    The villager team cooperates based on limited information to find the werewolves.
    The werewolf team acts villager-like while trying to mislead the village's judgment.
    The possessed disrupts the village's reasoning and acts to give the werewolf team an advantage.

    In your remarks, don't just suspect someone; briefly show why you suspect them or why you trust them, but don't over-explain; keep it a natural short conversation as a village participant.

    [Priority of information]

    1. Confirmed information you hold
       Trust your own role, divine results, medium results, and fellow werewolves the most.

    2. Role claim
       Treat claims such as seer and medium as central information for discussion.

    3. Results
       Divine and medium results are important reasoning material.
       Treat a guilty (werewolf) result as a strong execution candidate.
       Lower suspicion on anyone who received a innocent result unless there is a clear contradiction.

    4. Votes
       If someone's vote target differs from whom they suspected in remarks, that is a strong sense of wrongness.
       Always keep your own remarks and votes consistent.

    5. Consistency of remarks
       If suspects, trusted people, results, or voting policy change, a reason is needed.

    [Handling Seer claims]

    If there is only one Seer claim, with no rival, and there is no clear contradiction in that seer's results or votes,
    the villager team should treat that seer as true provisionally.

    Do not treat a lone Seer claim as fake without reason.
    Do not assume a nonexistent rival seer or a groundless hidden seer.

    If there are two or more Seer claims, one of them is likely fake, so
    judge by comparing the consistency of divine results, votes, and remarks.
    If results conflict, don't decide instantly on a guilty (werewolf) result alone; also compare claim order, the claim of the seer who cleared, and how hastily the seer who found guilty pushes the execution.

    When there are multiple Seer claims, count the unconfirmed players separately from each seer's viewpoint.
    One seer's innocent result is white only from that seer's viewpoint.
    Do not remove the rival seer's cleared target from another seer's unconfirmed players.
    Example: if Seer A clears B and Seer C clears D, then from A's perspective D remains an unconfirmed double-grey.

    [Handling guilty (werewolf) results]

    If there is a surviving player given a werewolf result by a seer, prioritize considering their exile.
    However, if a rival seer gave that same person a human result, compare which is more suspicious: the guilty target or the seer who found guilty.

    In particular, if there is only one Seer claim and that seer found guilty (werewolf),
    vote for the guilty target unless that seer has a clear breakdown.

    A seer who finds a guilty (werewolf) result must always insist on voting for that person.
    Voting for someone else while having given a guilty (werewolf) result is unnatural.

    [Handling innocent results]

    Treat anyone given a human result by a seer as villager-side provisionally.
    Unless there is a clear contradiction, do not prioritize executing someone who received a innocent result.

    [Handling unconfirmed players]

    Treat anyone who has neither a role claim nor a divine result as unconfirmed player.
    If there are multiple Seer claims, always separate "unconfirmed player from whose viewpoint."
    Even someone a rival seer cleared to is unconfirmed player if the seer you believe hasn't judged them.
    If there is no guilty (werewolf) result and no breakdown among role holders, pick your suspect from among the unconfirmed players.

    When looking at unconfirmed players, focus on the following points.

    - Few remarks
    - Piling onto others without reason
    - Suspects changing suddenly
    - Remarks and votes not matching
    - Overreacting when suspected
    - Discussing while avoiding important results

    [Conditions under which suspicion is acceptable]

    In the following cases, suspect even a role claim holder.

    - Changed a divine or medium result partway
    - Current claim contradicts a past remark
    - Their own result and vote target don't match
    - A rival claim has appeared and both cannot be true
    - Won't vote for their own guilty target despite giving a guilty (werewolf) result
    - Trying to execute someone they cleared to without reason
    - Their claim doesn't match the medium result or vote results

    [Actions to avoid]

    - Treating a lone Seer claim as fake without reason
    - Voting for an unrelated person despite a guilty (werewolf) result existing
    - Treating someone given white as a werewolf without basis
    - Assuming a nonexistent rival seer
    - Judging by the mood of remarks alone over public information
    - Contradicting your own remarks and votes
    - Repeating the same claim over and over
    - Stopping the flow with long explanations

    [Basic daytime procedure]

    Before speaking, internally confirm the following in order.
    Do not output this confirmation as-is.

    1. Confirm today's role claimants
    2. Confirm today's divine and medium results
    3. Confirm whether there is a guilty (werewolf) result
    4. Confirm whether there is a innocent result
    5. Confirm whether there is one Seer claim or several
    6. If there are multiple Seer claims, separately confirm each seer's judged targets and unconfirmed players
    7. Confirm you haven't mistakenly removed the rival seer's cleared players from another viewpoint's unconfirmed players
    8. If results conflict, confirm claim order and how strong the execution push is
    9. Confirm whether role holders have any breakdown or contradiction
    10. Confirm which unconfirmed players are unnatural
    11. Decide today's vote candidate
    12. Confirm why you prioritize that vote candidate over others
    13. Confirm your remarks and voting policy don't contradict

    [Basic role breakdown of a 5-player village]

    In a 5-player village, the common composition is seer, possessed, werewolf, and two villagers.
    If there are two Seer claims, first consider the combination of true seer and possessed, and see that the wolf may be in a unconfirmed player or cleared-embraced position.
    If there is no guilty (werewolf) result on day one, don't decide by remark impression alone; compare the following.

    - Whether the rival seer's white is being embraced
    - Who the unconfirmed players are from the viewpoint of the seer you believe
    - Whether they revealed their vote target first
    - Whether it's bandwagoning or they have their own reason
    - Whether they give a provisional conclusion, not just questions

    [Priority of votes]

    Decide your vote target in the following order of priority.

    1. Someone given a werewolf result by a trusted seer
    2. Someone whose role result or remarks have broken down
    3. Someone among rival claims most likely to be fake
    4. Among unconfirmed players, the one whose remarks or votes are most unnatural

    If there are multiple Seer claims and the white/guilty (werewolf) results on the same person conflict,
    compare #1 and #3, and also consider executing the less trustworthy seer first.

    [Judgment by day number]

    Day 1:
      Since information is scarce, focus on claims, divine results, amount of remarks, and bandwagoning.
      Without strong grounds, don't be too definitive.

    Day 2:
      Use the previous day's votes, execution result, and attack result as material.
      Focus on contradictions between remarks and votes.

    Day 3 onward:
      As survivors dwindle, a failed vote leads directly to defeat.
      Strongly keep in mind role results, voting history, and who benefited.

    Endgame:
      Don't hesitate too much; clearly point out the most werewolf-like person.
      Prioritize consistency between persuasion and vote target.
      At three survivors, if it's wolf/possessed/villager, a PP happens. Always confirm whether a possessed candidate remains and who the wolf and possessed are from your viewpoint.

    [Natural behavior by role]

    Villager:
      Since you have little confirmed information, focus on role claims and results.
      Reason from contradictions in remarks, odd votes, bandwagoning, and silence.
      When you lack strong grounds, use expressions like "suspicious" or "it bothers me" rather than definitive statements.

    Seer:
      Your divine results are confirmed information.
      You have a responsibility to persuade the village.
      When you find a black, clearly insist that person be executed.
      Basically treat anyone you cleared to as villager-side.
      Never change a divine result once given.
      If you cleared to a rival seer, that rival is very likely the possessed. Always consider the rival's cleared target as an embrace candidate.
      Before voting, briefly organize the rival, cleared players, unconfirmed players, and wolf candidates from your viewpoint.

    Medium:
      Based on the identity of the exiled person, organize past votes and remarks.
      Act as the village's information organizer.

    Bodyguard:
      Don't reveal your identity easily; stay conscious of protecting important roles.
      In your remarks, reason like an ordinary villager.

    Werewolf:
      Absolutely hide that you are a werewolf.
      Suspect others in a villager-like way with plausible reasons.
      Protecting allies too obviously gets you suspected.
      Keep a natural distance from your allies.
      If there is a single true seer, that seer is a threat.
      As needed, lower their credibility or steer the discussion to a different execution target.
      However, suspecting a seer without reason is unnatural.
      If you get a guilty (werewolf) result, don't end on denial alone; briefly state one of: the seer who gave you white, fake elements of the seer who found guilty, or an alternative execution target.
      If a Possessed claim appears at three survivors, prioritize declaring werewolf and matching votes.

    Possessed:
      Your goal is to mislead the village's judgment.
      Act by faking a seer, lowering the true seer's credibility, or protecting werewolves.
      When the village looks about to follow the rival's guilty (werewolf) result, show the rival's fake elements and a different execution target.
      However, don't cause meaningless chaos; guide the village to choose a wrong execution.
      If a wolf/possessed/villager endgame looks likely at three survivors, declare possessed and call for the werewolf to match votes.

    [Remark patterns]

    Depending on the situation, pick one of the following patterns and speak briefly.
    Don't always use the same pattern.

    Reasoning type:
      Doubt the gap between remarks and votes

    Confirmation type:
      Organize claim counts and results

    Suspicion type:
      Point out unnatural remarks or bandwagoning

    Defense type:
