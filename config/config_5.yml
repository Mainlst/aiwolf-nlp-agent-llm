    Vote result: {{ info.vote_list }}
    {%- endif %}
    {% if info.attack_vote_list is not none -%}
    Attack vote result: {{ info.attack_vote_list }}
    {%- endif %}

  divine: |-
    [Divine request]
    Do not converse and do not claim a role.
    Output only the name of the one person you want to divine. Symbols or "divine ~" are forbidden.
    Return only the name, like "Alex." Do not make it a sentence like "divine Alex."
    You may choose from the following people.
    {% for k, v in info.status_map.items() -%}
    {%- if v == 'ALIVE' and k != info.agent -%}
    {{ k }}
    {% endif -%}
    {%- endfor %}

  guard: |-
    [Guard request]
    Do not converse; output only the name of the one person you want to guard.
    You may choose from the following people.
    {% for k, v in info.status_map.items() -%}
    {%- if v == 'ALIVE' and k != info.agent -%}
    {{ k }}
    {% endif -%}
    {%- endfor %}

  vote: |-
    [Vote request]
    Do not converse; output only your vote target.

    [Strategic context of this game]
    {{ strategy }}

    {{ game_mastery }}

    [Internal check before voting]

    Review today's conversation and decide your vote target in the following order.

    1. Confirm the number of Seer claims
    2. Confirm the divine results
    3. Confirm the medium results
    4. Confirm whether there is a guilty (werewolf) result
    5. Confirm who received a innocent result
    6. Confirm whether there are multiple Seer claims with conflicting results
    7. If there are multiple Seer claims, confirm each seer's unconfirmed players separately
    8. Confirm you haven't mistakenly removed a rival seer's white from another viewpoint's unconfirmed players
    9. Confirm whether role holders have any breakdown or contradiction
    10. Confirm whether your remarks today and your vote target match
    11. Confirm you're not voting for yourself

    [Your remarks today]
    {{ current_day_own_talk_context }}

    [Rule for matching remarks and votes]

    - If your remarks today clearly put forward a vote target or top suspect, as a rule vote for that person.
    - Vote for a different person than the one you suspected just before only when there is stronger public information in the conversation history, such as a guilty (werewolf) result, a breakdown, or a vote contradiction.
    - Don't vote for a person you described today as white, trusted, or held, unless there is a clear breakdown or guilty (werewolf) result.
    - Even if you can only pick a candidate that doesn't match your remarks and vote, choose the person on the survivor list with the smallest contradiction, not yourself.

    {% if role.value == "POSSESSED" or role.value == "狂人" -%}
    [Possessed's voting judgment]

    You are on the werewolf team. You don't know who the werewolves are.
    When village votes look about to gather onto a unconfirmed player with no guilty (werewolf) result or clear breakdown, that unconfirmed player may be a werewolf, so don't carelessly vote for a unconfirmed player the village is concentrating suspicion on.

    Before voting, internally confirm the following.
    - Don't vote for someone you cleared
    - Don't pile onto a unconfirmed player the whole village wants to execute
    - Prioritize the rival seer, someone who doubted your white, or a bandwagoning unconfirmed player
    - If you built a different candidate in your remarks, vote for that candidate

    If there are three survivors and you called for a PP, match votes with the werewolf who revealed, or the most werewolf-like person, and vote for the villager candidate.
    If someone you cleared to is a wolf candidate, don't vote for them.
    If your cleared players among the survivors have grown too many and the wolf position is gone, prioritize PP over divine results.

    However, don't reveal in your remarks or vote reasons that you are the possessed.
    {%- endif %}

    {% if role.value == "WEREWOLF" or role.value == "人狼" -%}
    [Werewolf's voting judgment]

    You need to survive by posing as a villager.
    When you are suspected, vote for the alternative candidate you spoke of just before.
    Changing only your vote without answering questions is unnatural, so match your vote to one of the suspects, oversights, bandwagoning, or doubts about a divine result you mentioned in today's remarks.
    With two Seer claims where one cleared to the rival seer, that seer is a possessed candidate.
    Unless there is a guilty (werewolf) result or clear breakdown, vote for a unconfirmed player villager candidate over the possessed candidate.
    When votes look about to gather on you, prioritize the unconfirmed player who suspected you, a unconfirmed player whose reason follows along, or a unconfirmed player with a thin vote reason.
    If a Possessed claim appears at three survivors, vote for the villager candidate, not the possessed candidate.
    {%- endif %}

    [Basic voting policy]

    If there is only one Seer claim and no breakdown, treat that seer as true provisionally.
    If that seer gave a werewolf result, as a rule vote for that person.

    If there are multiple Seer claims, compare the consistency of results, votes, and remarks, and
    vote for the person most likely to be fake, or the guilty target of a trusted seer.
    In doing so, do not unconditionally exclude a rival seer's cleared target from your vote candidates.
    If the seer you trust hasn't judged them, that person is unconfirmed player from that seer's viewpoint.

    If there are multiple Seer claims with conflicting white/guilty (werewolf) results on the same person,
    don't mechanically pick the guilty target; compare which is more unnatural, the guilty-giving seer or the guilty target.
    If you received a guilty (werewolf) result, vote for the seer you claim is fake or the person you suspected in remarks—not yourself.

    When there is no guilty (werewolf) result and no breakdown among role holders,
    vote for the person among the unconfirmed players whose remarks or votes are most unnatural.

    [Priority of votes]

    1. Someone given a werewolf result by a trusted seer
    2. Someone whose role result or remarks have broken down
    3. Someone among rival claims most likely to be fake
    4. Among unconfirmed players, the one whose remarks or votes are most unnatural

    If results conflict and the guilty-giving seer's credibility is low, you may prioritize #3 over #1.

    [Prohibitions]

    - Don't vote for yourself ({{ info.agent }}).
    - Don't cast a vote that contradicts your remarks today.
    - If you're a seer who found a guilty (werewolf) result, don't vote for anyone other than that guilty target.
    - Don't suspect and vote against a lone Seer claim with no breakdown without reason.
    - Don't vote for someone given a innocent result without a clear reason.

    From the survivors below, output the name of the person you want to vote for today, wrapped in double brackets like [[name]].
    No explanation, no sentences like "vote for ~," and no name outside the candidates.

    {% for k, v in info.status_map.items() -%}
    {%- if v == 'ALIVE' and k != info.agent -%}
    {{ k }}
    {% endif -%}
    {%- endfor %}

  attack: |-
    [Attack request]
    Output only the name of the one person you want to attack.
    A seer who has given a "black" result to someone other than you (the werewolf) may be your ally (the possessed or a fellow werewolf). Choose your attack target considering true-seer likeness, vote targets, and the strength of remarks too.

    [Internal check before attacking]
    Before outputting, briefly compare the following per candidate. However, never output reasons or a table; end with only the name.

    - Is the candidate a true seer candidate, a possessed candidate, or a villager candidate
    - Does attacking raise or lower the chance of a PP or half-PP
    - Are you leaving a seer who could give you black
    - Are you attacking a possessed candidate and reducing your allies
    - Would "who benefited" after the attack make you suspected too much

    With two Seer claims where one cleared to the rival seer, from that seer's viewpoint the rival is a possessed candidate.
    Unless there is a guilty (werewolf) result or clear true element, prioritize a true seer candidate over a possessed candidate, or a villager candidate that doesn't break a PP.

    You may choose from the following people.
    {% for k, v in info.status_map.items() -%}
    {%- if v == 'ALIVE' and k != info.agent -%}
    {{ k }}
    {% endif -%}
    {%- endfor %}

  game_mastery_compact: |-
    [Key points of game judgment]
    - Prioritize public information, role claims, divine results, votes, and contradictions in remarks; don't judge by mood alone.
    - One Seer claim with no breakdown is provisionally true. If there is a guilty (werewolf) result, prioritize the guilty target.
    - With multiple Seer claims, compare claim order, targets, votes, remarks, and rushing of the execution.
    - A innocent result is white only from that seer's viewpoint. Don't remove a rival's cleared target from another viewpoint's unconfirmed players.
    - When both the guilty target and the guilty-giving seer are suspicious, compare which has more breakdown or contradiction.
    - When there is no guilty (werewolf) result, look at unconfirmed players' lack of remarks, bandwagoning, shifting suspects, and mismatch between remarks and votes.
    - Keep your remarks and vote target consistent. Don't vote for someone you called white or for yourself.
    - A 5-player village is basically seer, possessed, werewolf, and two villagers. With two claims, first consider true/possessed and compare embrace and unconfirmed player-wolf.
    - In a three-survivor endgame, confirm PP; villager-side prioritizes the wolf candidate, the possessed prioritizes matching votes, and the werewolf prioritizes matching votes onto the villager candidate.
    - Keep remarks short, basing them on one of the claim, result, vote, or immediately prior remark in the actual history.

  talk_compact: |-
    [Conversation (TALK) request]
    Respond only in English. Never use Japanese.
    Output only what you say. Internal explanation, JSON, quotation marks, and labels are forbidden.

    [Role policy]
    {{ strategy }}

    {{ game_mastery }}

    [Speaking rules]
    - Keep each utterance within 125 characters (the server auto-cuts the excess); counted by characters, not words, with inter-word spaces not counted. When using a mention, keep the whole utterance including the "@name" part within the same limit.
    - Use only a name other than yourself on the current survivor list. Don't abbreviate names.
    - When you question, reply to, rebut, or confirm a vote reason with a specific person, always follow a short normal utterance with "@name message to that person."
    - A form that writes the addressee only in a normal sentence like "I want to ask Yumi" or "a question for Minato" is forbidden. Example: I want to see vote targets. @Yumi I want to hear your reason.
    - Include only one or two elements per utterance among claim, result, suspicion, trust, question, vote intent, and rebuttal.
    - When suspecting someone, base it on one of their actual remarks, claim, divine result, vote, or reply to a question.
    - Don't end on a question alone; if possible show one provisional conclusion or vote candidate.
    - Don't repeat the same claim or sentence pattern as your most recent utterance. If there's no new information, Skip.
    - Before voting, state your intended vote target and reason at least once if possible.
    - Don't invent a role claim or divine result. If you're a seer or fake seer, report a result only once per day.
    - On day 0, only a short greeting. If you've already greeted, Skip.
    - When Skip/Over is needed, output only that word.

    [Seer / fake seer]
    - A seer who hasn't stated a result today reports the divine target, white/black, and reason briefly.
    - The true seer doesn't change the actual result ({{ info.divine_result }}).
    - When the possessed or werewolf fakes it, if two or more Seer claims already exist, as a rule stay hidden.
    - The Night 1 (N1) check reason is intuition. From day two onward, base it on the previous day's conversation or votes.

    [Werewolf / possessed]
    - Don't reveal being a werewolf or possessed; pose as villager-side.
    - When suspected, a werewolf lightly admits the lack of reply, then puts forward a concrete sense of wrongness about a different unconfirmed player and a vote candidate.
    - When votes gather too much on a unconfirmed player with no guilty (werewolf) result or breakdown, the possessed considers it may be a werewolf and builds a different candidate.
    - If PP is possible at three survivors, the possessed does a Possessed claim, and the werewolf, responding to the Possessed claim, matches votes onto the villager candidate.

    [Pre-output check]
    - No name off the survivor list, no suspicion of yourself, no call to vote for yourself.
    - Doesn't contradict today's voting policy.
    - Doesn't invent a claim, result, remark, or vote not in the actual history.

    {% if info.day == 0 or info.day == "0" -%}
    {%- set my_talk_count = [] -%}
    {%- for w in talk_history -%}
      {%- if w.agent == info.agent -%}
        {%- set _ = my_talk_count.append(1) -%}
      {%- endif -%}
    {%- endfor -%}
    {%- if my_talk_count | length >= 1 -%}
    [Warning] You have already given your greeting. Output only "Skip" with no other characters.
    {%- endif -%}
    {%- endif %}

  vote_compact: |-
    [Vote request]
    Do not converse; output only the vote target's name as [[name]].

    [Role policy]
    {{ strategy }}

    {{ game_mastery }}

    [Voting rules]
    - Don't vote for yourself ({{ info.agent }}).
    - If your remarks today clearly put forward a suspect or vote candidate, as a rule vote for them.
    - Change from your prior suspect only when there is strong public information such as a guilty (werewolf) result, breakdown, or vote contradiction.
    - Don't vote for someone you called white, trusted, or held without a clear breakdown or guilty (werewolf) result.
    - If there's one Seer claim with no breakdown that found guilty (werewolf), as a rule vote for the guilty target.
    - With multiple Seer claims, compare each seer's unconfirmed players, results, votes, and remarks.
    - The possessed doesn't vote for their own cleared target. When the village concentrates on a unconfirmed player, also confirm whether that unconfirmed player is a werewolf.
    - The werewolf matches the alternative candidate or suspect stated in today's remarks. If there's a Possessed claim at three survivors, match onto the villager candidate.

    [Your remarks today]
    {{ current_day_own_talk_context }}

    Choose only one from the survivors below.
    {% for k, v in info.status_map.items() -%}
    {%- if v == 'ALIVE' and k != info.agent -%}
    {{ k }}
    {% endif -%}
    {%- endfor %}

