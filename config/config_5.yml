       - When there is no guilty (werewolf) result, suspect an unnatural person among the unconfirmed players.
    26. [Key policy for the werewolf team]
       - Never reveal that you're on the werewolf team.
       - Suspect others in a villager-like way with natural reasons grounded in public information.
       - If there is a single true seer, don't suspect without reason; find doubts in remarks, votes, or results to lower their credibility.
       - If you get a guilty (werewolf) result, don't end on denial alone; put forward one of: the seer you believe, fake elements, the danger of executing you, or an alternative vote target.
