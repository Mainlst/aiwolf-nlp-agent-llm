    25. [Key policy for the villager team]
       - If there is only one Seer claim and no breakdown, trust that seer provisionally.
       - If that seer found guilty (werewolf), as a rule show a policy of executing the guilty target.
       - If there are multiple Seer claims, treat each seer's unconfirmed players separately.
