  vote: '[Vote request]

    Do not converse; output only your vote target.


    [Strategic context of this game]

    {{ strategy }}


    {{ game_mastery }}


    [Internal check before voting]


    Review today''s conversation and decide your vote target in the following order.


    1. Confirm the number of Seer claims

    2. Confirm the divine results

    3. Confirm the medium results

    4. Confirm whether there is a guilty (werewolf) result

    5. Confirm who received a innocent result

    6. Confirm whether there are multiple Seer claims with conflicting results

    7. If there are multiple Seer claims, confirm each seer''s unconfirmed players
    separately

    8. Confirm you haven''t mistakenly removed a rival seer''s white from another
    viewpoint''s unconfirmed players

    9. Confirm whether role holders have any breakdown or contradiction

    10. Confirm whether your remarks today and your vote target match

    11. Confirm you''re not voting for yourself


    [Your remarks today]

    {{ current_day_own_talk_context }}


    [Rule for matching remarks and votes]


    - If your remarks today clearly put forward a vote target or top suspect, as a
    rule vote for that person.

    - Vote for a different person than the one you suspected just before only when
    there is stronger public information in the conversation history, such as a guilty
    (werewolf) result, a breakdown, or a vote contradiction.

    - Don''t vote for a person you described today as white, trusted, or held, unless
    there is a clear breakdown or guilty (werewolf) result.

    - Even if you can only pick a candidate that doesn''t match your remarks and vote,
    choose the person on the survivor list with the smallest contradiction, not yourself.


    {% if role.value == "POSSESSED" or role.value == "狂人" -%}

    [Possessed''s voting judgment]


    You are on the werewolf team. You don''t know who the werewolves are.

    When village votes look about to gather onto a unconfirmed player with no guilty
    (werewolf) result or clear breakdown, that unconfirmed player may be a werewolf,
    so don''t carelessly vote for a unconfirmed player the village is concentrating
    suspicion on.


    Before voting, internally confirm the following.

    - Don''t vote for someone you cleared

    - Don''t pile onto a unconfirmed player the whole village wants to execute

    - Prioritize the rival seer, someone who doubted your white, or a bandwagoning
    unconfirmed player

    - If you built a different candidate in your remarks, vote for that candidate


    If someone you cleared to is a wolf candidate, don''t vote for them.


    However, don''t reveal in your remarks or vote reasons that you are the possessed.

    {%- endif %}


    {% if role.value == "WEREWOLF" or role.value == "人狼" -%}

    [Werewolf''s voting judgment]


    You need to survive by posing as a villager.

    When you are suspected, vote for the alternative candidate you spoke of just before.

    Changing only your vote without answering questions is unnatural, so match your
    vote to one of the suspects, oversights, bandwagoning, or doubts about a divine
    result you mentioned in today''s remarks.

    With two Seer claims where one cleared to the rival seer, that seer is a possessed
    candidate.

    Unless there is a guilty (werewolf) result or clear breakdown, vote for a unconfirmed
    player villager candidate over the possessed candidate.

    When votes look about to gather on you, prioritize the unconfirmed player who
    suspected you, a unconfirmed player whose reason follows along, or a unconfirmed
    player with a thin vote reason.

    {%- endif %}


    [Basic voting policy]


    If there is only one Seer claim and no breakdown, treat that seer as true provisionally.

    If that seer gave a werewolf result, as a rule vote for that person.


    If there are multiple Seer claims, compare the consistency of results, votes,
    and remarks, and

    vote for the person most likely to be fake, or the guilty target of a trusted
    seer.

    In doing so, do not unconditionally exclude a rival seer''s cleared target from
    your vote candidates.

    If the seer you trust hasn''t judged them, that person is unconfirmed player from
    that seer''s viewpoint.


    If there are multiple Seer claims with conflicting white/guilty (werewolf) results
    on the same person,

    don''t mechanically pick the guilty target; compare which is more unnatural, the
    guilty-giving seer or the guilty target.

    If you received a guilty (werewolf) result, vote for the seer you claim is fake
    or the person you suspected in remarks—not yourself.


    When there is no guilty (werewolf) result and no breakdown among role holders,

    vote for the person among the unconfirmed players whose remarks or votes are most
    unnatural.


    [Priority of votes]


    1. Someone given a werewolf result by a trusted seer

    2. Someone whose role result or remarks have broken down

    3. Someone among rival claims most likely to be fake

    4. Among unconfirmed players, the one whose remarks or votes are most unnatural


    If results conflict and the guilty-giving seer''s credibility is low, you may
    prioritize #3 over #1.


    [Prohibitions]


    - Don''t vote for yourself ({{ info.agent }}).

    - Don''t cast a vote that contradicts your remarks today.

    - If you''re a seer who found a guilty (werewolf) result, don''t vote for anyone
    other than that guilty target.

    - Don''t suspect and vote against a lone Seer claim with no breakdown without
    reason.

    - Don''t vote for someone given a innocent result without a clear reason.


    From the survivors below, output the name of the person you want to vote for today,
    wrapped in double brackets like [[name]].

    No explanation, no sentences like "vote for ~," and no name outside the candidates.


    {% for k, v in info.status_map.items() -%}

    {%- if v == ''ALIVE'' and k != info.agent -%}

    {{ k }}

    {% endif -%}

    {%- endfor %}'
