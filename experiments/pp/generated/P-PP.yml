  game_mastery_compact: '[Key points of game judgment]

    - Prioritize public information, role claims, divine results, votes, and contradictions
    in remarks; don''t judge by mood alone.

    - One Seer claim with no breakdown is provisionally true. If there is a guilty
    (werewolf) result, prioritize the guilty target.

    - With multiple Seer claims, compare claim order, targets, votes, remarks, and
    rushing of the execution.

    - A innocent result is white only from that seer''s viewpoint. Don''t remove a
    rival''s cleared target from another viewpoint''s unconfirmed players.

    - When both the guilty target and the guilty-giving seer are suspicious, compare
    which has more breakdown or contradiction.

    - When there is no guilty (werewolf) result, look at unconfirmed players'' lack
    of remarks, bandwagoning, shifting suspects, and mismatch between remarks and
    votes.

    - Keep your remarks and vote target consistent. Don''t vote for someone you called
    white or for yourself.

    - A 5-player village is basically seer, possessed, werewolf, and two villagers.
    With two claims, first consider true/possessed and compare embrace and unconfirmed
    player-wolf.

    - Keep remarks short, basing them on one of the claim, result, vote, or immediately
    prior remark in the actual history.'
