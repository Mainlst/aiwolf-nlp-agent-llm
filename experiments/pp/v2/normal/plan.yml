schema_version: 2
study_id: aiwolfdial-2026-pp-v2-normal-400
purpose: Compare P+ v2 and P-PP v2 in 200 matched normal-game pairs.
created_at: '2026-08-15T00:00:00+09:00'
source_document: doc/experiment-plan.md
condition_spec: experiments/pp/v2/spec.yml
evaluation_spec: experiments/pp/v2/evaluation-spec.yml
assignment_file: experiments/pp/v2/normal/assignments.csv
opponent_registry: experiments/pp/pilot/opponent-pools.yml
base_server_config: config/server.example.yml
target_team: yatolab
target_agent_count: 1
server_url: ws://127.0.0.1:8080/ws
assignment_seed: 20260817
conditions: [P+, P-PP]
matched_pairs: 200
planned_games_per_condition: 200
games_per_block: 20
fixed_runtime:
  language: en
  player_count: 5
  roles: {VILLAGER: 2, SEER: 1, POSSESSED: 1, WEREWOLF: 1}
  target_roles: {POSSESSED: 200, WEREWOLF: 200}
  talk_per_agent_per_day: 4
  model: gpt-5.6-luna
  temperature: 1.0
  max_retries: 0
  output_guard_enabled: true
  dynamic_context_enabled: true
  role_strategy_enabled: true
pricing_usd_per_million_tokens:
  source: https://developers.openai.com/api/docs/pricing
  retrieved_at: '2026-08-15'
  context_threshold_tokens: 272000
  standard:
    short_context: {input: 0.20, cached_input: 0.02, cache_write: 0.25, output: 1.20}
    long_context: {input: 0.40, cached_input: 0.04, cache_write: 0.50, output: 1.80}
stopping_rules:
  unintended_model: stop_immediately
  missing_or_unjoinable_fraction: 0.0
  placement_mismatch: stop_at_end_of_current_block
  result_blinding: condition-specific wins must not be written to block audit files
opponent_O:
  id: O
  condition_independent: true
  source_config: config/config_5.yml
  agents: [opponentOalpha, opponentObravo, opponentOcharlie, opponentOdelta]
  speech_styles: [fixed-neutral]
  model: gpt-5.6-luna
  temperature: 1.0
  max_retries: 0
server_matching:
  self_match: false
  is_optimize: true
  team_count: 5
  game_count_per_row: 1
backup:
  destination: release-backups/pp
  required_before_paid_run: true
